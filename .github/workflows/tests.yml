name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Mirror]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run tests
        run: make
